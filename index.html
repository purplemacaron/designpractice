<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 연습장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;background:#fff;color:#0a0a0a;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}

/* ---------- 메인 ---------- */
#home{max-width:1000px;margin:0 auto;padding:110px 24px 80px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:64px}
.hero h1{font-size:clamp(48px,9vw,92px);font-weight:800;letter-spacing:-.055em;line-height:.98}
.hero h1 i{font-style:normal;color:#d4d4d4}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
#prog{font-size:13px;font-weight:600;color:#a3a3a3;letter-spacing:.04em}
.pb{width:180px;height:3px;background:#f0f0f0;border-radius:9px;overflow:hidden}
.pb i{display:block;height:100%;background:#0a0a0a;transition:width .5s}
.cta{font-size:16px;font-weight:700;padding:16px 34px;border-radius:999px;background:#0a0a0a;color:#fff;transition:transform .15s}
.cta:hover{transform:scale(1.04)}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:820px){#grid{grid-template-columns:repeat(2,1fr)}.side{align-items:flex-start}}
.card{position:relative;aspect-ratio:1/1.12;display:flex;flex-direction:column;text-align:left;padding:18px;border:1px solid #ebebeb;border-radius:20px;background:#fff;transition:transform .18s,border-color .18s,box-shadow .18s}
.card:not(:disabled):hover{transform:translateY(-4px);border-color:#0a0a0a;box-shadow:0 14px 30px rgba(0,0,0,.08)}
.card .no{font-size:12px;font-weight:700;color:#b5b5b5;letter-spacing:.06em}
.card .st{position:absolute;top:16px;right:18px;font-size:12px;font-weight:700;color:#f59e0b}
.card b{margin-top:auto;font-size:23px;font-weight:800;letter-spacing:-.04em}
.card .th{font-size:12px;color:#a3a3a3;margin-top:2px}
.card.done{background:#0a0a0a;border-color:#0a0a0a;color:#fff}
.card.done .no,.card.done .th{color:#8a8a8a}
.card:disabled{cursor:default;background:#fafafa;color:#cfcfcf;border-color:#f3f3f3}
.card:disabled .no,.card:disabled .th{color:#dcdcdc}
.card:disabled .st{color:#d4d4d4}

/* ---------- 게임 ---------- */
.bar{display:flex;align-items:center;gap:18px;height:64px;padding:0 24px;border-bottom:1px solid #f0f0f0}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid #ebebeb;font-size:16px;flex:none}
.ib:hover{border-color:#0a0a0a}
.ttl{display:flex;align-items:baseline;gap:10px;flex:none}
.ttl span{font-size:12px;font-weight:700;color:#b5b5b5;letter-spacing:.06em}
.ttl b{font-size:20px;font-weight:800;letter-spacing:-.04em}
#mission{flex:1;font-size:14px;color:#737373;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#segs{display:flex;gap:4px;flex:none}
#segs i{width:18px;height:4px;border-radius:9px;background:#ececec}
#segs i.done{background:#0a0a0a}#segs i.cur{background:#2563eb}
.work{display:grid;grid-template-columns:220px 480px 260px;gap:44px;justify-content:center;padding:32px 16px 60px}
@media(max-width:1120px){.work{grid-template-columns:minmax(0,480px);gap:24px}#segs{display:none}}
#tray{display:flex;flex-direction:column;gap:6px}
#tray button{display:flex;align-items:center;gap:8px;font-size:13px;text-align:left;padding:10px 12px;border:1px solid #ebebeb;border-radius:12px;transition:.15s}
#tray button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tray button b{flex:none;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:#f3f3f3;color:#525252}
#tray button:not(:disabled):hover{border-color:#0a0a0a;transform:translateX(3px)}
#tray button:disabled{opacity:.28;border-style:dashed;cursor:default}
#deco{display:flex;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid #f0f0f0}
#deco button{flex:1;height:38px;border:1px solid #ebebeb;border-radius:12px;font-size:14px;color:#525252}
#deco button:hover{border-color:#0a0a0a}

#props{height:84px;padding:10px 12px;margin-bottom:14px;border:1px solid #ebebeb;border-radius:16px;display:flex;flex-direction:column;justify-content:space-between}
.prow{display:flex;align-items:center;gap:5px;height:28px}
.seg{display:flex;background:#f3f3f3;border-radius:8px;padding:2px;margin-right:6px}
.seg button{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;color:#8a8a8a}
.seg button.on{background:#fff;color:#0a0a0a;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid #dcdcdc;cursor:pointer;flex:none}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #2563eb}
.tb{min-width:30px;height:28px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:700;color:#525252}
.tb:hover{background:#f3f3f3}.tb.on{background:#0a0a0a;color:#fff}
.fsv{font-size:12px;font-weight:600;width:38px;text-align:center;color:#525252}
.sp{flex:1}

#stage{position:relative}
#cv{position:relative;width:480px;height:600px;border-radius:6px;box-shadow:0 0 0 1px #ebebeb,0 24px 60px rgba(0,0,0,.09);overflow:hidden;touch-action:none;transform-origin:0 0;user-select:none;-webkit-user-select:none}
#safe{position:absolute;inset:32px;border:1px dashed rgba(160,160,160,.4);pointer-events:none;z-index:999}
.gd{position:absolute;background:#2563eb;pointer-events:none;z-index:1000;display:none}
#gv{width:1px;top:0;bottom:0}#gh{height:1px;left:0;right:0}
.el{position:absolute;cursor:move;white-space:pre;line-height:1.3;letter-spacing:-.01em}
.el.image{display:flex;align-items:center;justify-content:center;border-radius:14px;line-height:1}
.el.button{border-radius:999px;padding:.65em 1.5em;font-weight:700;line-height:1.2}
.el.sel{outline:1.5px solid #2563eb;outline-offset:2px}
.el.bad{outline:2px dashed #ef4444;outline-offset:3px}
.hd{position:absolute;right:-8px;bottom:-8px;width:12px;height:12px;background:#fff;border:1.5px solid #2563eb;border-radius:50%;cursor:nwse-resize}

.score{display:flex;flex-direction:column;align-items:center;margin-bottom:18px}
.ring{position:relative;width:148px;height:148px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:#f0f0f0}
.ring .fg{stroke:#0a0a0a;stroke-linecap:round;stroke-dasharray:326.73;stroke-dashoffset:326.73;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1),stroke .3s}
.ring .fg.fail{stroke:#ef4444}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#total{font-size:46px;font-weight:800;letter-spacing:-.05em;line-height:1}
.ring small{font-size:10px;font-weight:700;color:#b5b5b5;letter-spacing:.06em;margin-top:4px}
#stars{font-size:18px;letter-spacing:5px;color:#f59e0b;margin-top:10px}
.acts{display:flex;gap:6px;margin-bottom:22px}
.btn{flex:1;height:46px;border-radius:14px;font-size:14px;font-weight:700;background:#0a0a0a;color:#fff;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.blue{background:#2563eb}
.acts .ib{width:46px;height:46px;border-radius:14px}
.m{padding:11px 0;border-top:1px solid #f3f3f3}
.m .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.m .top u{text-decoration:none;display:inline-block;width:6px;height:6px;border-radius:50%;background:#2563eb;margin-left:6px;vertical-align:middle}
.m .mb{height:3px;background:#f3f3f3;border-radius:9px;margin-top:7px;overflow:hidden}
.m .mb i{display:block;height:100%;background:#0a0a0a;border-radius:9px}
.m .mb i.low{background:#ef4444}.m .mb i.mid{background:#f59e0b}
.m p{font-size:12px;color:#737373;margin-top:7px}
</style>
</head>
<body>

<div id="home">
  <div class="hero">
    <h1>디자인<br>연습장<i>.</i></h1>
    <div class="side">
      <span id="prog"></span>
      <div class="pb"><i id="pbar"></i></div>
      <button class="cta" id="startB"></button>
    </div>
  </div>
  <div id="grid"></div>
</div>

<div id="game" hidden>
  <header class="bar">
    <button class="ib" id="homeB" title="메인">←</button>
    <div class="ttl"><span id="stno"></span><b id="concept"></b></div>
    <p id="mission"></p>
    <div id="segs"></div>
  </header>
  <div class="work">
    <aside><div id="tray"></div><div id="deco"></div></aside>
    <div>
      <div id="props"></div>
      <div id="stage"><div id="cv"><div id="safe"></div><div id="gv" class="gd"></div><div id="gh" class="gd"></div></div></div>
    </div>
    <aside>
      <div class="score">
        <div class="ring">
          <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="arc" cx="60" cy="60" r="52"/></svg>
          <div><span id="total">–</span><small>PASS 80</small></div>
        </div>
        <div id="stars">☆☆☆</div>
      </div>
      <div class="acts">
        <button class="ib" id="resetB" title="비우기">↺</button>
        <button class="btn" id="gradeB">채점</button>
        <button class="btn blue" id="nextB" hidden>다음 →</button>
      </div>
      <div id="report"></div>
    </aside>
  </div>
</div>

<script>
const W=480,H=600,M=32,$=s=>document.querySelector(s);
const COLORS=[['#111827',0],['#4b5563',0],['#9ca3af',0],['#e5e7eb',0],['#ffffff',0],
['#1e3a8a','파랑'],['#2563eb','파랑'],['#dbeafe','파랑'],['#ef4444','빨강'],['#f59e0b','노랑'],['#fef3c7','노랑'],
['#10b981','초록'],['#8b5cf6','보라'],['#ec4899','분홍'],['#fce7f3','분홍']];
const FAM=Object.fromEntries(COLORS);
const ROLE={title:'제목',sub:'부제',body:'본문',label:'라벨',card:'카드',image:'이미지',button:'버튼',panel:'색 면',deco:'장식'};
const T=(key,role,text,fs,o={})=>({key,kind:'text',role,text,fs,bold:role==='title',color:'#111827',align:'left',...o});
const I=(key,emoji,w,h,fill,role='image')=>({key,kind:'image',role,text:emoji,w,h,fill});
const B=(key,text,o={})=>({key,kind:'button',role:'button',text,fs:15,fill:'#111827',color:'#ffffff',...o});
const P=(key,w,h,fill)=>({key,kind:'shape',role:'panel',w,h,fill});
const DECO=[{n:'■',kind:'shape',role:'deco',w:120,h:120,fill:'#e5e7eb'},{n:'●',kind:'shape',role:'deco',w:96,h:96,fill:'#e5e7eb',circle:true},{n:'—',kind:'shape',role:'deco',w:160,h:4,fill:'#111827'}];

const STAGES=[
{c:'정렬',m:'카페 오픈 포스터',g:'기준선 하나에 맞추기',metrics:['align','need','clear'],
 sprites:[T('t','title','카페 모노 오픈',40),T('s','sub','11월 28일 금요일 · 연남동',18),T('b','body','오픈 기념 아메리카노 1+1\n매일 오전 9시 – 오후 9시',14),I('i','☕',160,160,'#fef3c7'),B('c','오시는 길')]},
{c:'여백',m:'사진전 초대장',g:'점선 안쪽에 배치하기',metrics:['margin','align','need','clear'],
 sprites:[T('t','title','빛의 기록',46),T('s','sub','김하늘 사진전',18),T('b','body','2026. 12. 01 – 12. 20\n성수 갤러리 온 · 무료 관람',14),I('i','📷',200,200,'#f3f4f6'),T('l','label','GALLERY ON',12,{bold:true})]},
{c:'근접성',m:'재즈 페스티벌 안내',g:'제목끼리, 정보끼리 묶기',metrics:['proximity','align','margin','need','clear'],
 sprites:[T('t','title','겨울밤 재즈 페스티벌',34,{group:'제목 묶음'}),T('s','sub','도심에서 즐기는 라이브 재즈',16,{group:'제목 묶음'}),T('b1','body','📅 12월 12일 토요일 18:00',15,{group:'정보 묶음'}),T('b2','body','📍 한강 난지공원 특설무대',15,{group:'정보 묶음'}),T('b3','body','🎟 전석 30,000원',15,{group:'정보 묶음'}),I('i','🎷',140,140,'#dbeafe'),B('c','예매하기')]},
{c:'위계',m:'여행 뉴스레터 표지',g:'글자 크기로 순서 만들기',metrics:['hierarchy','align','margin','need','clear'],
 sprites:[T('t','title','제주 한 바퀴',16,{bold:false}),T('s','sub','3가지 코스로 즐기는 1박 2일',16),T('b','body','오름 산책부터 바다 카페까지,\n에디터가 직접 걸어본 길을 소개합니다.',16),T('l','label','TRAVEL LETTER · VOL. 12',16),I('i','🏝',180,160,'#dbeafe')]},
{c:'대비',m:'겨울 세일 배너',g:'글자가 읽히게 색 고치기',metrics:['contrast','hierarchy','margin','need','clear'],
 sprites:[P('p',416,240,'#1e3a8a'),T('t','title','WINTER SALE',44,{color:'#9ca3af'}),T('s','sub','최대 50% 할인',20,{color:'#9ca3af'}),T('b','body','12월 1일 – 12월 14일 · 전 품목',14,{color:'#e5e7eb'}),B('c','지금 쇼핑하기',{fill:'#e5e7eb',color:'#ffffff'})]},
{c:'균형',m:'헤드폰 광고',g:'좌우 무게 맞추기',metrics:['balance','align','margin','need','clear'],
 sprites:[I('i','🎧',220,220,'#f3f4f6'),T('t','title','소리에만\n집중하세요',38),T('b','body','노이즈 캔슬링 헤드폰 MONO X\n30시간 연속 재생',14),B('c','자세히 보기')]},
{c:'반복',m:'카페 메뉴판',g:'카드와 라벨 통일하기',metrics:['repeat','align','margin','need','clear'],
 sprites:[T('t','title','오늘의 메뉴',36),I('c1','☕',96,96,'#dbeafe','card'),I('c2','🥐',128,112,'#fef3c7','card'),I('c3','🍰',112,144,'#fce7f3','card'),T('l1','label','아메리카노 4,000',12),T('l2','label','크루아상 4,500',16,{color:'#2563eb'}),T('l3','label','치즈케이크 6,500',14,{color:'#4b5563'})]},
{c:'색상',m:'영어 앱 홍보물',g:'색 계열 2개 이하로',metrics:['color','contrast','align','margin','need','clear'],
 sprites:[T('t','title','하루 10분 영어',40,{color:'#ef4444'}),T('s','sub','출퇴근길에 끝내는 회화 습관',16,{color:'#10b981'}),T('b','body','지금 가입하면 첫 달 무료',14,{color:'#2563eb'}),I('i','📱',180,180,'#fef3c7'),P('p',416,8,'#ec4899'),B('c','무료로 시작하기',{fill:'#8b5cf6'})]},
{c:'간격',m:'세미나 일정표',g:'간격 값 3종류 이하로',metrics:['rhythm','proximity','align','margin','need','clear'],
 sprites:[T('t','title','디자인 세미나 2026',34,{group:'제목 묶음'}),T('s','sub','작은 팀을 위한 디자인 시스템',16,{group:'제목 묶음'}),T('b1','body','10:00   오프닝 키노트',15,{group:'일정 묶음'}),T('b2','body','11:00   컴포넌트 설계 실습',15,{group:'일정 묶음'}),T('b3','body','13:00   질의응답 · 네트워킹',15,{group:'일정 묶음'}),B('c','참가 신청')]},
{c:'종합',m:'플리마켓 포스터',g:'전부 적용하기',final:true,
 metrics:['hierarchy','contrast','align','margin','proximity','balance','color','rhythm','need','clear'],
 sprites:[T('t','title','연남 플리마켓',40,{group:'제목 묶음'}),T('s','sub','취향을 나누는 주말 장터',16,{group:'제목 묶음'}),T('b1','body','📅 12월 6일 토요일 12:00–18:00',15,{group:'정보 묶음'}),T('b2','body','📍 연남동 경의선숲길 일대',15,{group:'정보 묶음'}),I('i','🧺',200,200,'#fef3c7'),B('c','셀러 신청하기')]}
];
const LAST=STAGES.length-1;

/* ---------- 상태 ---------- */
let st={stage:0,els:[],bg:'#ffffff',sel:null},uid=1,bad=new Set(),drag=null,scale=1,cprop='fill';
let save={open:0,best:[]};
try{const s=JSON.parse(localStorage.getItem('designGame'));if(s&&Array.isArray(s.best))save=s}catch(e){}
const persist=()=>{try{localStorage.setItem('designGame',JSON.stringify(save))}catch(e){}};
const cv=$('#cv'),byId=id=>st.els.find(e=>e.id===id),sel=()=>byId(st.sel);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const best=i=>save.best[i]||0;
const starN=t=>t>=97?3:t>=90?2:t>=80?1:0;
const starS=t=>'★'.repeat(starN(t))+'☆'.repeat(3-starN(t));
const pad=i=>String(i+1).padStart(2,'0');

/* ---------- 색 계산 ---------- */
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);
const lum=h=>{const[r,g,b]=rgb(h).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*r+.7152*g+.0722*b};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};

/* ---------- 메인 화면 ---------- */
function renderHome(){
  const done=STAGES.filter((s,i)=>best(i)>=80).length;
  $('#prog').textContent=done+' / '+STAGES.length;
  $('#pbar').style.width=done/STAGES.length*100+'%';
  $('#startB').textContent=save.best.some(Boolean)?'이어하기':'시작하기';
  $('#grid').innerHTML=STAGES.map((s,i)=>{const b=best(i),lock=i>save.open;
    return '<button class="card'+(b>=80?' done':'')+'" data-i="'+i+'"'+(lock?' disabled':'')+'><span class="no">'+pad(i)+'</span><span class="st">'+(lock?'🔒':b>=80?'★'.repeat(starN(b)):b?b:'')+'</span><b>'+s.c+'</b><span class="th">'+s.m+'</span></button>'}).join('');
}
function goHome(){$('#game').hidden=true;$('#home').hidden=false;renderHome();scrollTo(0,0)}
function goGame(i){$('#home').hidden=true;$('#game').hidden=false;fit();loadStage(i);scrollTo(0,0)}
$('#grid').onclick=ev=>{const b=ev.target.closest('.card');if(b&&!b.disabled)goGame(+b.dataset.i)};
$('#startB').onclick=()=>goGame(Math.min(save.open,LAST));
$('#homeB').onclick=goHome;

/* ---------- 그리기 ---------- */
function styleEl(n,e){
  n.style.left=e.x+'px';n.style.top=e.y+'px';
  if(e.kind==='text'){n.style.fontSize=e.fs+'px';n.style.color=e.color;n.style.fontWeight=e.bold?700:400;n.style.textAlign=e.align}
  else if(e.kind==='button'){n.style.fontSize=e.fs+'px';n.style.color=e.color;n.style.background=e.fill}

    if(e.kind==='image')n.style.fontSize=Math.min(e.w,e.h)*.5+'px';
    if(e.circle)n.style.borderRadius='50%'}
}
const node=e=>cv.querySelector('.el[data-id="'+e.id+'"]');
function measure(){
  st.els.forEach(e=>{const n=node(e);if(!n)return;
    if(e.kind==='text'||e.kind==='button'){e.w=n.offsetWidth;e.h=n.offsetHeight}

const swatches=(prop,cur)=>COLORS.map(c=>'<span class="sw'+(c[0]===cur?' on':'')+'" data-p="'+prop+'" data-c="'+c[0]+'" style="background:'+c[0]+'"></span>').join('');
function renderProps(){

  const cps=[];if(e.fill)cps.push('fill');if(e.color)cps.push('color');
  if(!cps.includes(cprop))cprop=cps[0];
  let h='<div class="prow"><span class="seg">'+cps.map(c=>'<button data-cp="'+c+'" class="'+(c===cprop?'on':'')+'">'+(c==='fill'?'면':'글자')+'</button>').join('')+'</span>'+swatches(cprop,e[cprop])+'</div><div class="prow">';
  if(e.fs)h+='<button class="tb" data-a="fs-" title="작게">A−</button><span class="fsv">'+e.fs+'</span><button class="tb" data-a="fs+" title="크게">A+</button>';
  if(e.kind==='text'){h+='<button class="tb'+(e.bold?' on':'')+'" data-a="bold" title="굵게">B</button>';
    if(e.text.includes('\n'))h+='<button class="tb" data-a="align" title="줄 정렬">'+({left:'⇤',center:'↔',right:'⇥'}[e.align])+'</button>'}
  h+='<span class="sp"></span><button class="tb" data-a="front" title="앞으로">↑</button><button class="tb" data-a="back" title="뒤로">↓</button><button class="tb" data-a="del" title="삭제">✕</button></div>';

$('#props').onclick=ev=>{
  const t=ev.target,e=sel();
  if(t.dataset.cp){cprop=t.dataset.cp;renderProps();return}
  if(t.dataset.c){if(t.dataset.p==='bg')st.bg=t.dataset.c;else if(e)e[t.dataset.p]=t.dataset.c}
  else if(t.dataset.a&&e){const a=t.dataset.a;
    if(a==='fs-')e.fs=clamp(e.fs-2,10,72);
    if(a==='fs+')e.fs=clamp(e.fs+2,10,72);
    if(a==='bold')e.bold=!e.bold;

const GAPS=[8,16,24,32,48];
function snap(e,nx,ny){
  const o=st.els.filter(x=>x!==e);
  const cx=[0,M,W/2,W-M,W],cy=[0,M,H/2,H-M,H],xs=[[],[],[]],ys=[[],[],[]];
  o.forEach(b=>{
    cx.push(b.x,b.x+b.w/2,b.x+b.w);cy.push(b.y,b.y+b.h/2,b.y+b.h);
    if(nx<b.x+b.w&&nx+e.w>b.x)GAPS.forEach(g=>{ys[0].push(b.y+b.h+g);ys[2].push(b.y-g)});
    if(ny<b.y+b.h&&ny+e.h>b.y)GAPS.forEach(g=>{xs[0].push(b.x+b.w+g);xs[2].push(b.x-g)});
  });
  const f=(p,s,common,extra)=>{let bst=null;[0,s/2,s].forEach((off,i)=>{common.concat(extra[i]).forEach(t=>{const d=t-(p+off);if(Math.abs(d)<6&&(!bst||Math.abs(d)<Math.abs(bst.d)))bst={d,t}})});return bst};
  const bx=f(nx,e.w,cx,xs),by=f(ny,e.h,cy,ys),gv=$('#gv'),gh=$('#gh');
  gv.style.display=bx?'block':'none';if(bx)gv.style.left=bx.t+'px';
  gh.style.display=by?'block':'none';if(by)gh.style.top=by.t+'px';
  return[bx?nx+bx.d:Math.round(nx/8)*8,by?ny+by.d:Math.round(ny/8)*8];
}
cv.addEventListener('pointerdown',ev=>{
  const n=ev.target.closest('.el');
  bad.clear();
  if(!n){st.sel=null;refresh();return}
  const e=byId(+n.dataset.id),isH=ev.target.classList.contains('hd');
  st.sel=e.id;refresh();
  drag={e,mode:isH?'size':'move',px:ev.clientX,py:ev.clientY,x:e.x,y:e.y,w:e.w,h:e.h,fs:e.fs};
  ev.preventDefault();
});
window.addEventListener('pointermove',ev=>{
  if(!drag)return;
  const e=drag.e,dx=(ev.clientX-drag.px)/scale,dy=(ev.clientY-drag.py)/scale,n=node(e);
  if(!n)return;
  if(drag.mode==='move'){
    const[x,y]=snap(e,clamp(drag.x+dx,0,Math.max(0,W-e.w)),clamp(drag.y+dy,0,Math.max(0,H-e.h)));
    e.x=clamp(x,0,Math.max(0,W-e.w));e.y=clamp(y,0,Math.max(0,H-e.h));
  }else if(e.fs){e.fs=clamp(Math.round(drag.fs*(drag.h+dy)/drag.h),10,72)}
  else{e.w=clamp(Math.round((drag.w+dx)/4)*4,8,W-e.x);e.h=clamp(Math.round((drag.h+dy)/4)*4,4,H-e.y)}
  styleEl(n,e);measure();
});
window.addEventListener('pointerup',()=>{if(!drag)return;drag=null;$('#gv').style.display=$('#gh').style.display='none';refresh()});
window.addEventListener('keydown',ev=>{
  const e=sel();if(!e||$('#game').hidden)return;
  const k=ev.key,d=ev.shiftKey?8:1;
  if(k==='Delete'||k==='Backspace'){st.els=st.els.filter(x=>x!==e);st.sel=null}
  else if(k==='ArrowLeft')e.x-=d;else if(k==='ArrowRight')e.x+=d;else if(k==='ArrowUp')e.y-=d;else if(k==='ArrowDown')e.y+=d;
  else return;
  ev.preventDefault();bad.clear();refresh();
});
function fit(){scale=Math.min(1,(window.innerWidth-32)/W);cv.style.transform='scale('+scale+')';$('#stage').style.width=W*scale+'px';$('#stage').style.height=H*scale+'px'}
window.addEventListener('resize',fit);

/* ---------- 채점 ---------- */
const rc=e=>({l:e.x,t:e.y,r:e.x+e.w,b:e.y+e.h,cx:e.x+e.w/2,cy:e.y+e.h/2});
const gap=(a,b)=>{const A=rc(a),B=rc(b);return Math.hypot(Math.max(0,A.l-B.r,B.l-A.r),Math.max(0,A.t-B.b,B.t-A.b))};
const range=a=>Math.max(...a)-Math.min(...a);
const isText=e=>e.kind==='text'||e.kind==='button';
function under(e){const i=st.els.indexOf(e),c=rc(e);
  for(let j=i-1;j>=0;j--){const o=st.els[j];if(isText(o))continue;const r=rc(o);
    if(c.cx>=r.l&&c.cx<=r.r&&c.cy>=r.t&&c.cy<=r.b)return o.fill}
  return st.bg}

const METRICS={
need:{name:'필수 요소',fn(els,s){
  const miss=s.sprites.filter(p=>!els.some(e=>e.key===p.key));
  return{s:100*(1-miss.length/s.sprites.length),bad:[],tip:miss.length?'미배치 '+miss.length+'개: '+miss.map(p=>ROLE[p.role]).join(', '):''}}},
clear:{name:'겹침',fn(els){
  const t=els.filter(isText),b=new Set();let n=0;
  for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){const A=rc(t[i]),B=rc(t[j]);
    if(A.l<B.r-1&&B.l<A.r-1&&A.t<B.b-1&&B.t<A.b-1){n++;b.add(t[i].id);b.add(t[j].id)}}
  return{s:100-34*n,bad:[...b],tip:n?'글자 겹침 '+n+'곳':''}}},
align:{name:'정렬',fn(els){
  const n=els.length;if(n<2)return{s:0,bad:[],tip:'요소 2개 이상 필요'};
  const R=els.map(rc),b=[];let maxG=1;
  els.forEach((e,i)=>{let ok=Math.abs(R[i].cx-W/2)<=1.5;
    ['l','cx','r'].forEach(k=>{const c=R.filter(o=>Math.abs(o[k]-R[i][k])<=1.5).length;if(c>1)ok=true;maxG=Math.max(maxG,c)});
    if(!ok)b.push(e.id)});
  const need=Math.ceil(n*.6),sc=60*(n-b.length)/n+40*Math.min(1,maxG/need);
  let tip='';
  if(b.length)tip='기준선에서 벗어난 요소 '+b.length+'개';
  else if(maxG<need)tip='기준선이 흩어짐 · 한 선에 '+need+'개 이상 (현재 '+maxG+'개)';
  return{s:sc,bad:b,tip}}},
margin:{name:'여백',fn(els){
  const n=els.length;if(!n)return{s:0,bad:[],tip:'요소 없음'};
  const b=[],tips=[];let area=0;
  els.forEach(e=>{const r=rc(e),bleed=e.kind==='shape'||e.kind==='image';area+=e.w*e.h;
    if([r.l,r.t,W-r.r,H-r.b].some(d=>d<M-1&&!(bleed&&d<=2)))b.push(e.id)});
  const cov=area/(W*H);let den=100;
  if(b.length)tips.push('안전 영역('+M+'px) 침범 '+b.length+'개');
  if(cov<.08){den=cov/.08*100;tips.push('화면이 너무 비어 있음')}
  else if(cov>.6){den=Math.max(0,100-(cov-.6)*300);tips.push('화면이 너무 꽉 참')}
  return{s:70*(n-b.length)/n+.3*den,bad:b,tip:tips.join(' · ')}}},
proximity:{name:'근접성',fn(els){
  const g={};els.filter(e=>e.group).forEach(e=>(g[e.group]=g[e.group]||[]).push(e));
  const names=Object.keys(g).filter(k=>g[k].length>1);
  if(names.length<2)return{s:0,bad:[],tip:'묶음 요소를 먼저 배치'};
  const b=[],tips=[];let sum=0;
  names.forEach(k=>{const mem=g[k],oth=els.filter(e=>e.group&&e.group!==k);
    const intra=Math.max(...mem.map(a=>Math.min(...mem.filter(x=>x!==a).map(x=>gap(a,x)))));
    const inter=Math.min(...mem.map(a=>Math.min(...oth.map(x=>gap(a,x)))));
    let sc=clamp(inter/Math.max(intra,4)-1,0,1)*100;
    if(intra>48)sc*=.6;
    if(sc<100){mem.forEach(e=>b.push(e.id));tips.push(k+': 안 '+Math.round(intra)+'px / 밖 '+Math.round(inter)+'px')}
    sum+=sc});
  return{s:sum/names.length,bad:b,tip:tips.length?tips.join(' · ')+' → 밖 간격을 안의 2배 이상, 안은 48px 이하':''}}},
hierarchy:{name:'위계',fn(els){
  const t=els.find(e=>e.role==='title'),s=els.find(e=>e.role==='sub'),bs=els.filter(e=>e.kind==='text'&&(e.role==='body'||e.role==='label'));
  if(!t||!bs.length)return{s:0,bad:[],tip:'제목과 본문 필요'};
  const bf=Math.max(...bs.map(e=>e.fs)),mid=s?s.fs:bf*1.25,tips=[],b=[];
  let sc=40*clamp((t.fs/mid-1)/.5,0,1);
  if(t.fs/mid<1.5){tips.push('제목 '+t.fs+'px → '+Math.ceil(mid*1.5)+'px 이상');b.push(t.id)}
  if(s){sc+=25*clamp((s.fs/bf-1)/.2,0,1);if(s.fs/bf<1.2){tips.push('부제 '+s.fs+'px → 본문의 1.2배 이상');b.push(s.id)}}else sc+=25;
  if(t.bold)sc+=10;else tips.push('제목 굵게');
  if(t.y<Math.min(...bs.filter(e=>e.role==='body').map(e=>e.y).concat([H])))sc+=10;else tips.push('제목을 본문 위로');
  const badB=bs.filter(e=>e.fs<12||e.fs>18);
  if(!badB.length)sc+=15;else{tips.push('본문·라벨 12–18px');badB.forEach(e=>b.push(e.id))}
  return{s:sc,bad:b,tip:tips.join(' · ')}}},
contrast:{name:'대비',fn(els){
  const t=els.filter(isText);if(!t.length)return{s:0,bad:[],tip:'글자 요소 필요'};
  const b=[],tips=[];let sum=0;
  t.forEach(e=>{const bgc=e.kind==='button'?e.fill:under(e),r=cr(e.color,bgc),th=e.fs>=24?3:4.5;
    sum+=Math.min(1,r/th);
    if(r<th){b.push(e.id);tips.push(ROLE[e.role]+' '+r.toFixed(1)+':1 (기준 '+th+')')}});
  return{s:Math.pow(sum/t.length,1.5)*100,bad:b,tip:tips.join(' · ')}}},
balance:{name:'균형',fn(els){
  if(els.length<2)return{s:0,bad:[],tip:'요소 2개 이상 필요'};
  let sw=0,sx=0,sy=0;
  els.forEach(e=>{const r=rc(e),k=e.kind==='text'?.5:e.kind==='image'?.6:e.kind==='button'?1:.15+.85*Math.abs(lum(e.fill)-lum(st.bg)),w=e.w*e.h*k;sw+=w;sx+=w*r.cx;sy+=w*r.cy});
  const ox=(sx/sw-W/2)/(W/2),oy=(sy/sw-H/2)/(H/2),tips=[];
  const sc=100-Math.max(0,Math.abs(ox)-.06)*280-Math.max(0,Math.abs(oy)-.2)*150;
  if(Math.abs(ox)>.06)tips.push((ox<0?'왼쪽':'오른쪽')+'으로 '+Math.round(Math.abs(ox)*100)+'% 쏠림');
  if(Math.abs(oy)>.2)tips.push((oy<0?'위':'아래')+'로 몰림');
  return{s:sc,bad:[],tip:tips.join(' · ')}}},
repeat:{name:'반복',fn(els){
  const g={};els.filter(e=>e.role!=='deco').forEach(e=>(g[e.role]=g[e.role]||[]).push(e));
  const ks=Object.keys(g).filter(k=>g[k].length>1);
  if(!ks.length)return{s:0,bad:[],tip:'카드·라벨을 여러 개 배치'};
  let pass=0,tot=0;const b=new Set(),tips=[];
  ks.forEach(k=>{const m=g[k],tx=m[0].kind==='text',nm=ROLE[k];
    const fail=msg=>{tips.push(nm+' '+msg);m.forEach(e=>b.add(e.id))};
    tot++;if(tx?range(m.map(e=>e.fs))===0&&m.every(e=>e.bold===m[0].bold):range(m.map(e=>e.w))<=2&&range(m.map(e=>e.h))<=2)pass++;else fail('크기 불일치');
    tot++;if(m.every(e=>(tx?e.color:e.fill)===(tx?m[0].color:m[0].fill)))pass++;else fail('색 불일치');
    const R=m.map(rc),row=range(R.map(r=>r.t))<=2||range(R.map(r=>r.cy))<=2,col=range(R.map(r=>r.l))<=2||range(R.map(r=>r.cx))<=2;
    tot++;if(row||col)pass++;else fail('한 줄 아님');
    if(m.length>2){tot++;
      if(row||col){const a=R.slice().sort((p,q)=>row?p.l-q.l:p.t-q.t),gs=[];
        for(let i=1;i<a.length;i++)gs.push(row?a[i].l-a[i-1].r:a[i].t-a[i-1].b);
        if(range(gs)<=3)pass++;else fail('간격 '+gs.map(Math.round).join('/')+'px')}}});
  return{s:100*pass/tot,bad:[...b],tip:tips.join(' · ')}}},
color:{name:'색상',fn(els){
  if(!els.length)return{s:0,bad:[],tip:'요소 없음'};
  const fam=new Set();let area=0;const add=c=>{if(c&&FAM[c])fam.add(FAM[c])};
  add(st.bg);els.forEach(e=>{add(e.fill);add(e.color);if(e.fill&&FAM[e.fill])area+=e.w*e.h});
  const n=fam.size,ps=[55,100,100,70,45,25,10][Math.min(n,6)],ratio=area/(W*H),tips=[];
  let as=30;
  if(n===0){as=10;tips.push('포인트 색 없음')}
  else if(n>2)tips.push('색 계열 '+n+'개 ('+[...fam].join(', ')+') → 2개 이하');
  if(n&&!FAM[st.bg]&&ratio>.45){as=5;tips.push('포인트 색 면적 '+Math.round(ratio*100)+'% → 45% 이하')}
  return{s:ps*.7+as,bad:[],tip:tips.join(' · ')}}},
rhythm:{name:'간격',fn(els){
  const c=els.filter(e=>e.kind!=='shape'),gs=[],b=new Set();let cramped=0;
  c.forEach(a=>{let bst=null,bb=null;const A=rc(a);
    c.forEach(o=>{if(o===a)return;const B=rc(o);
      if(A.l<B.r&&B.l<A.r&&B.t>=A.b-1){const g=B.t-A.b;if(bst===null||g<bst){bst=g;bb=o}}});
    if(bst!==null&&bst<160){gs.push(bst);if(bst<7){cramped++;b.add(a.id);b.add(bb.id)}}
    let hb=null;c.forEach(o=>{if(o===a||o.role!==a.role)return;const B=rc(o);
      if(A.t<B.b&&B.t<A.b&&B.l>=A.r-1){const g=B.l-A.r;if(hb===null||g<hb)hb=g}});
    if(hb!==null&&hb<160)gs.push(hb)});
  if(gs.length<3)return{s:0,bad:[],tip:'위아래로 쌓아 간격 3곳 이상 만들기'};
  gs.sort((x,y)=>x-y);const cl=[gs[0]];gs.forEach(g=>{if(g-cl[cl.length-1]>3)cl.push(g)});
  const sc=[100,100,100,75,50,30][Math.min(cl.length-1,5)]-12*cramped,tips=[];
  if(cl.length>3)tips.push('간격 '+cl.length+'종류 ('+cl.map(Math.round).join(', ')+'px) → 3종류 이하');
  if(cramped)tips.push('8px 미만 '+cramped+'곳');
  return{s:sc,bad:[...b],tip:tips.join(' · ')}}}
};

function grade(){
  const s=STAGES[st.stage];bad.clear();st.sel=null;
  const res=s.metrics.map((m,i)=>{const r=METRICS[m].fn(st.els,s);r.s=clamp(Math.round(r.s),0,100);r.name=METRICS[m].name;r.focus=i===0&&!s.final;r.w=r.focus?3:1;r.key=m;return r});
  let total=Math.round(res.reduce((a,r)=>a+r.s*r.w,0)/res.reduce((a,r)=>a+r.w,0));
  if(res.find(r=>r.key==='need').s<100)total=Math.min(total,79);
  res.forEach(r=>{if(r.s<100)r.bad.forEach(id=>bad.add(id))});
  setScore(total);
  $('#report').innerHTML=res.map(r=>'<div class="m"><div class="top"><span>'+r.name+(r.focus?'<u title="핵심 ×3"></u>':'')+'</span><span>'+r.s+'</span></div><div class="mb"><i class="'+(r.s<50?'low':r.s<80?'mid':'')+'" style="width:'+r.s+'%"></i></div>'+(r.tip&&r.s<100?'<p>'+esc(r.tip)+'</p>':'')+'</div>').join('');
  save.best[st.stage]=Math.max(best(st.stage),total);
  if(total>=80&&st.stage<LAST)save.open=Math.max(save.open,st.stage+1);
  persist();renderSegs();renderNext();refresh();
}
$('#gradeB').onclick=grade;
$('#resetB').onclick=()=>loadStage(st.stage);
$('#nextB').onclick=()=>st.stage===LAST?goHome():loadStage(st.stage+1);

renderHome();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!$('#game').hidden)draw()});
</script>
</body>
